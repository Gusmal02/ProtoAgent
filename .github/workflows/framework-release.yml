name: Framework installed release regressions
on:
  push:
    paths: ['protoagent_framework/**', 'core/**', 'memory/**', 'framework/distribution/**', 'framework/f8_next/generation_transaction.py', 'framework/f8_next/durable_generation_transport.py', 'framework/f8_next/verified_tool_memory.py', 'tests/**', 'examples/**', 'tools/release_gate.py', 'pyproject.toml', 'setup.py', 'MANIFEST.in', '.github/workflows/framework-release.yml']
  pull_request:
    paths: ['protoagent_framework/**', 'core/**', 'memory/**', 'framework/distribution/**', 'framework/f8_next/generation_transaction.py', 'framework/f8_next/durable_generation_transport.py', 'framework/f8_next/verified_tool_memory.py', 'tests/**', 'examples/**', 'tools/release_gate.py', 'pyproject.toml', 'setup.py', 'MANIFEST.in', '.github/workflows/framework-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-wheel:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-latest]
        profile: [base, full]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate wheel and source
        run: |
          python -m pip install build "setuptools>=77"
          python -m build
      - name: Clean venv, install wheel, run sequential gate
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/framework-check"
          if [[ "$RUNNER_OS" == "Windows" ]]; then PY="$RUNNER_TEMP/framework-check/Scripts/python.exe"; else PY="$RUNNER_TEMP/framework-check/bin/python"; fi
          WHEEL=$(find dist -name '*.whl' -print -quit)
          if [[ "${{ matrix.profile }}" == "full" ]]; then "$PY" -m pip install "$WHEEL[motor]"; else "$PY" -m pip install "$WHEEL"; fi
          "$PY" -I tools/release_gate.py --wheel "$WHEEL" --profile "${{ matrix.profile }}" --output "$RUNNER_TEMP/framework-report"
      - name: Preserve reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regressions-${{ matrix.os }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/framework-report
          if-no-files-found: warn
